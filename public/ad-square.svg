<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="orb" cx="50%" cy="50%" r="50%" fx="50%" fy="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="600" cy="480" r="380" fill="#2563eb" opacity="0.08"/>
  <circle cx="600" cy="480" r="280" fill="#2563eb" opacity="0.1"/>
  <circle cx="600" cy="480" r="180" fill="#2563eb" opacity="0.15"/>

  <!-- Wave decoration bottom -->
  <path d="M0 1020 C150 980 300 1060 450 1020 C600 980 750 1060 900 1020 C1050 980 1150 1040 1200 1020 L1200 1200 L0 1200 Z" fill="url(#wave)" opacity="0.3"/>
  <path d="M0 1060 C200 1025 350 1080 500 1060 C650 1040 800 1080 950 1060 C1050 1045 1130 1065 1200 1055 L1200 1200 L0 1200 Z" fill="white" opacity="0.1"/>

  <!-- Logo box -->
  <rect x="510" y="100" width="180" height="180" rx="40" fill="#2563eb"/>
  <text x="530" y="225" font-family="Arial Black,sans-serif" font-weight="900" font-size="84" fill="white" letter-spacing="-3">DL</text>

  <!-- Company name -->
  <text x="600" y="350" font-family="Arial,sans-serif" font-weight="700" font-size="38" fill="white" text-anchor="middle">株式会社DLシステム海</text>
  <text x="600" y="400" font-family="Arial,sans-serif" font-weight="400" font-size="24" fill="#93c5fd" text-anchor="middle">DL System Umi Corporation</text>

  <!-- Divider -->
  <line x1="200" y1="440" x2="1000" y2="440" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>

  <!-- Main headline -->
  <text x="600" y="540" font-family="Arial Black,sans-serif" font-weight="900" font-size="72" fill="white" text-anchor="middle">システム開発</text>
  <text x="600" y="630" font-family="Arial Black,sans-serif" font-weight="900" font-size="72" fill="#60a5fa" text-anchor="middle">ITコンサルティング</text>

  <!-- Subtext -->
  <text x="600" y="710" font-family="Arial,sans-serif" font-size="30" fill="#93c5fd" text-anchor="middle">React / Node.js / AWS / GCP / Azure</text>

  <!-- Feature pills -->
  <rect x="160" y="750" width="240" height="52" rx="26" fill="#1d4ed8" opacity="0.8"/>
  <text x="280" y="782" font-family="Arial,sans-serif" font-size="22" fill="white" text-anchor="middle">Webアプリ開発</text>

  <rect x="480" y="750" width="240" height="52" rx="26" fill="#1d4ed8" opacity="0.8"/>
  <text x="600" y="782" font-family="Arial,sans-serif" font-size="22" fill="white" text-anchor="middle">クラウド構築</text>

  <rect x="800" y="750" width="240" height="52" rx="26" fill="#1d4ed8" opacity="0.8"/>
  <text x="920" y="782" font-family="Arial,sans-serif" font-size="22" fill="white" text-anchor="middle">AI活用支援</text>

  <!-- CTA button -->
  <rect x="400" y="840" width="400" height="80" rx="40" fill="#2563eb"/>
  <text x="600" y="889" font-family="Arial,sans-serif" font-weight="700" font-size="28" fill="white" text-anchor="middle">無料見積もり →</text>
</svg>
