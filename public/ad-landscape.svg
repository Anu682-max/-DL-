<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="628" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="628" fill="url(#bg)"/>

  <!-- Wave decoration -->
  <path d="M0 520 C150 480 300 560 450 520 C600 480 750 560 900 520 C1050 480 1150 540 1200 520 L1200 628 L0 628 Z" fill="url(#wave)" opacity="0.3"/>
  <path d="M0 555 C200 520 350 580 500 555 C650 530 800 580 950 555 C1050 535 1130 565 1200 550 L1200 628 L0 628 Z" fill="white" opacity="0.1"/>

  <!-- Logo box -->
  <rect x="80" y="80" width="90" height="90" rx="20" fill="#2563eb"/>
  <text x="95" y="143" font-family="Arial Black,sans-serif" font-weight="900" font-size="42" fill="white" letter-spacing="-2">DL</text>

  <!-- Company name -->
  <text x="190" y="120" font-family="Arial,sans-serif" font-weight="700" font-size="32" fill="white">株式会社DLシステム海</text>
  <text x="190" y="158" font-family="Arial,sans-serif" font-weight="400" font-size="20" fill="#93c5fd">DL System Umi Corporation</text>

  <!-- Main headline -->
  <text x="80" y="280" font-family="Arial Black,sans-serif" font-weight="900" font-size="62" fill="white">システム開発・</text>
  <text x="80" y="356" font-family="Arial Black,sans-serif" font-weight="900" font-size="62" fill="#60a5fa">ITコンサルティング</text>

  <!-- Subtext -->
  <text x="80" y="430" font-family="Arial,sans-serif" font-size="26" fill="#93c5fd">React / Node.js / AWS / GCP / Azure</text>

  <!-- CTA -->
  <rect x="80" y="470" width="280" height="65" rx="32" fill="#2563eb"/>
  <text x="220" y="511" font-family="Arial,sans-serif" font-weight="700" font-size="22" fill="white" text-anchor="middle">無料見積もり →</text>

  <!-- Right side decoration circles -->
  <circle cx="950" cy="314" r="200" fill="#2563eb" opacity="0.15"/>
  <circle cx="950" cy="314" r="140" fill="#2563eb" opacity="0.2"/>
  <circle cx="950" cy="314" r="80" fill="#2563eb" opacity="0.3"/>
  <text x="950" y="290" font-family="Arial Black,sans-serif" font-weight="900" font-size="52" fill="white" text-anchor="middle">DL</text>
  <text x="950" y="345" font-family="Arial,sans-serif" font-size="18" fill="#93c5fd" text-anchor="middle">システム海</text>
</svg>
